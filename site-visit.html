<style>
:root{--bg:#000;--fg:#fff;--card:#141414;--line:#5a5a5a;--muted:#c8c8c8;--acc:#ffd400;--accfg:#000;--ok:#00d26a;--na:#b8b8b8;--nafg:#000;--bad:#ff4d2e;--input:#000;--fs:18px}
:root[data-theme=day]{--bg:#fff;--fg:#000;--card:#f2f2f2;--line:#222;--muted:#333;--acc:#0038d1;--accfg:#fff;--ok:#007a33;--na:#555;--nafg:#fff;--bad:#c40000;--input:#fff}
:root.big{--fs:22px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.35;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:3px solid var(--acc);padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
header h1{flex:1;font-size:1.05rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{min-width:52px;min-height:52px;display:flex;align-items:center;justify-content:center;border:2px solid var(--fg);border-radius:10px;background:transparent;color:var(--fg);font-size:1.2rem;text-decoration:none}
.logo{font-size:1.6rem;padding:0 6px}
.stat{font-size:.7rem;color:var(--muted)}
.net{font-size:.65rem;font-weight:800;padding:3px 6px;border-radius:6px;border:2px solid}
.net.on{color:var(--ok)}.net.off{color:var(--bad)}
main{padding:10px;max-width:900px;margin:0 auto}
.card,details{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
details>summary{font-weight:800;font-size:1.05rem;min-height:48px;display:flex;align-items:center;cursor:pointer;list-style:none}
details>summary::before{content:'▶';margin-right:10px;font-size:.8rem}
details[open]>summary::before{content:'▼'}
details>summary::-webkit-details-marker{display:none}
.secbody{padding-top:6px}
.link{display:block;text-decoration:none;color:var(--fg)}
.card.link b{display:block;font-size:1.05rem}.card.link small,.item small{display:block;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.8rem}
h2.grp{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:18px 4px 6px}
h3{font-size:.95rem;margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.big{min-height:64px;width:100%;font-size:1.1rem}
.btn.sm{min-height:48px;padding:6px 12px;font-size:.9rem}
.btn.danger,button.danger{border-color:var(--bad);color:var(--bad)}
.btn.on{background:var(--na);color:var(--nafg)}
.btn[disabled]{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.grid2,.grid3{display:grid;gap:8px;margin:8px 0;grid-template-columns:1fr 1fr}
@media(min-width:620px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.grow{flex:1}
.fld{display:block;margin:8px 0}
.fld span{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font-size:1rem;min-height:52px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--input);color:var(--fg);font-family:inherit}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--acc);border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;min-height:52px}.chk input{width:32px;height:32px;min-height:0}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.stop{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--acc);border-radius:12px;padding:12px;margin:0 0 10px;min-height:64px}
.stopname{font-weight:800;font-size:1.05rem}.stopname small{color:var(--acc)}
.stopmeta{font-size:.85rem;color:var(--muted)}.iss{color:var(--bad)}
.ck{border-top:2px solid var(--line);padding:10px 0}
.ck-t{font-weight:600;margin-bottom:6px}
.ck.st-done .ck-t{color:var(--ok)}.ck.st-issue .ck-t{color:var(--bad)}.ck.st-na .ck-t{color:var(--na);text-decoration:line-through}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-size:.95rem;font-weight:800;touch-action:manipulation}
.seg3 button.on.done{background:var(--ok);border-color:var(--ok);color:#000}
.seg3 button.on.na{background:var(--na);border-color:var(--na);color:var(--nafg)}
.seg3 button.on.issue{background:var(--bad);border-color:var(--bad);color:#fff}
.seg3 button.danger{flex:0 0 56px}
.linkbtn{background:none;border:none;color:var(--acc);font-size:.9rem;min-height:40px;padding:4px 0;font-weight:700}
.shot{border:2px dashed var(--line);border-radius:10px;padding:10px;margin:0 0 10px}
.shot.done{border-style:solid;border-color:var(--ok)}
.shot-t{font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.th{position:relative;width:96px;height:96px;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#222;color:#fff;font-size:1.6rem}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.vb{position:absolute;bottom:2px;left:2px;font-size:.55rem;background:#000;color:#fff;padding:1px 3px}
.list .item{display:flex;gap:10px;align-items:center;border-top:2px solid var(--line);padding:10px 2px;min-height:60px}
.list .item>span{font-size:1.4rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{white-space:nowrap;padding:10px 12px;border:2px solid var(--line);border-radius:30px;text-decoration:none;color:var(--fg);font-size:.85rem;min-height:44px}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sub{border-top:1px solid var(--line);padding-top:6px}
code{font-size:.8em;word-break:break-all}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--bg);border-top:3px solid var(--acc);padding-bottom:env(safe-area-inset-bottom)}
nav.bot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;color:var(--fg);text-decoration:none;font-size:.75rem;font-weight:700}
nav.bot a span{font-size:1.4rem}
nav.bot a.on{background:var(--acc);color:var(--accfg)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);overflow:auto;padding:10px}
.mbox{background:var(--bg);border:2px solid var(--fg);border-radius:12px;padding:12px;max-width:800px;margin:0 auto}
.mbox img,.mbox video{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--acc);color:var(--accfg);font-weight:800;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1}

/* ---- v2: cold-room / gloved use: every touch target >= 60 px (review §4.7) ---- */
:root{--tap:60px}
.hbtn{min-width:var(--tap);min-height:var(--tap)}
.btn,.btn.sm{min-height:var(--tap);min-width:var(--tap)}
.btn.big{min-height:68px}
input,select{min-height:var(--tap)}
textarea{min-height:88px}
details>summary{min-height:var(--tap)}
.seg3 button{min-height:var(--tap)}.seg3 button.danger{flex:0 0 var(--tap)}
.linkbtn{min-height:var(--tap);min-width:120px;padding:4px 8px;text-align:left}
.chip{min-height:var(--tap);display:inline-flex;align-items:center}
.chk{min-height:var(--tap);cursor:pointer}.chk input{width:36px;height:36px;flex:0 0 36px}
.list .item{min-height:var(--tap)}
a.item,a.stop,a.card.link{min-height:var(--tap)}
/* dictation */
.dict{display:flex;gap:8px;align-items:stretch}.dict textarea{flex:1}
.mic{flex:0 0 var(--tap);min-height:var(--tap);min-width:var(--tap);border-radius:12px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font-size:1.5rem;align-self:flex-start;touch-action:manipulation}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* status pills, required markers */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:800;border:2px solid var(--line);vertical-align:middle}
.pill.st-verified,.pill.st-complete{background:var(--ok);border-color:var(--ok);color:#000}
.pill.st-na{background:var(--na);border-color:var(--na);color:var(--nafg)}
.reqb{color:var(--bad)}
.shot.req:not(.done){border-left:6px solid var(--bad);padding-left:8px}
.fld.req>span::after{content:'';}
.fld.miss>span{color:var(--bad);font-weight:800}
.fld.miss input,.fld.miss select,.fld.miss textarea{border-color:var(--bad);outline:3px solid var(--bad)}
.gate li{margin:6px 0;color:var(--bad);font-weight:700}
.capbox .fld{margin-bottom:6px}
.th .tb{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:.6rem;line-height:1.3;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .vb{top:0;bottom:auto}
.card.bk{border-left:8px solid var(--ok)}
.mbox .btn{margin:4px 0;width:100%}

/* ---- v3 (review should-fix: 16px minimum text, 44px+ targets, N/A contrast; must-fix banners) ---- */
.stat,.net,.small,.muted.small,.fld span,.pill,.chip,.vb,small,.linkbtn,legend,summary small{font-size:max(16px,.8rem)}
.stat.ok{color:var(--ok)}.stat.busy{color:var(--acc)}.stat.bad{color:#fff;background:var(--bad);padding:2px 8px;border-radius:6px;font-weight:900}
input,select,textarea,button{font-size:max(16px,1rem)}
#sysbars{position:sticky;top:0;z-index:30}
.sysbar{padding:10px 12px;border-bottom:2px solid #000;font-size:max(16px,.9rem);line-height:1.35}
.sysbar .row{margin:6px 0 0}
.sysbar.notsaved{background:#c40000;color:#fff}
.sysbar.quotabar{background:#ffd400;color:#000}
.sysbar.iosbar{background:#ff8c00;color:#000}
.sysbar .btn{min-height:48px;background:#fff;color:#000;border-color:#000}
.blocker{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}
.blocker .mbox{margin-top:8vh}
.blocker ol{line-height:1.8}
.fab{position:fixed;right:16px;bottom:96px;z-index:15;width:72px;height:72px;border-radius:50%;border:3px solid var(--accfg);background:var(--acc);color:var(--accfg);font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.6)}
main{padding-bottom:180px}
.segs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.btn.seg{flex:1 1 0;min-width:72px}
.btn.seg[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.seg.clear{flex:0 0 auto}
.item{border-top:2px solid var(--line);padding:10px 0}
.item.st-done{border-left:6px solid var(--ok);padding-left:8px}.item.st-blocked{border-left:6px solid var(--bad);padding-left:8px}.item.st-na{border-left:6px solid var(--na);padding-left:8px}
.shot.ok{border-style:solid;border-color:var(--ok)}.shot.need{border-left:6px solid var(--bad)}
.req{color:var(--bad)}
.gate li{margin:6px 0}
.secrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0}
.secrow .chk{min-height:var(--tap)}
.secrow a{flex:1;color:var(--fg);text-decoration:none;min-height:var(--tap);display:flex;align-items:center;gap:8px}
.card.warn{border-color:var(--acc)}
.card.bk{border-color:var(--acc)}
.capbox{border:2px dashed var(--line);border-radius:10px;padding:8px;margin:8px 0}
.navwrap{overflow:auto;max-height:70vh}
.navwrap table{border-collapse:collapse;font-size:max(16px,.8rem)}
.navwrap th,.navwrap td{border:1px solid var(--line);padding:4px;text-align:center}
.navwrap th{position:sticky;top:0;background:var(--card)}
.navwrap td input{width:32px;height:32px}
.pkrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.search input{width:100%}
/* v3.3.0 */
.nudge{background:#fff4e5;border:1px solid #f0a040;border-radius:8px;padding:6px 8px;margin:6px 0}
.prov{color:#a45a00;font-weight:600;white-space:nowrap}
/* 3.4.0 Reviewer v3.2.0 re-check: no horizontal scroll at 390px; bigger sysbar buttons + photo captions */
fieldset.chips{min-width:0}
.row2>*{min-width:0}
.row2 input,.row2 select{min-width:0;max-width:100%}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.sysbar .btn{min-height:60px}
.th .tb{font-size:12.5px;line-height:1.3}
/* v3.5.0 (Reviewer B1): long unbroken user text (tag paths, PLC addresses, filenames) never widens the layout */
.grow,.card,details,summary,.item,.list .item>*,.secrow a,.secrow>*,.pkrow>*,.row>*,.grid2>*,.grid3>*,.dict>*,.fld,.modal,.gate,.nudge,.sysbar,
p,li,small,b,code,h2,h3,label,.reclist a,.stop,.chk{min-width:0;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
input,select,textarea{max-width:100%;min-width:0}
select{text-overflow:ellipsis}
.chip{overflow-wrap:normal}
.navwrap td,.navwrap th{overflow-wrap:anywhere}
td,th{overflow-wrap:anywhere}
img,video{max-width:100%}
.conf td.won{font-weight:800;background:rgba(0,160,80,.15)}.conf td{text-align:left}
.conf td,.conf th{overflow-wrap:break-word;word-break:normal}
.conf{width:100%;table-layout:fixed}.conf td,.conf th{overflow-wrap:anywhere;word-break:normal;padding:6px 4px}
.conf td:nth-child(2){overflow-wrap:break-word;hyphens:auto}.conf .kept{display:block;font-size:12px;white-space:nowrap}
.conf .kept{color:var(--ok)}
/* 3.6.0 nit: nudges readable in both themes (dark default had white text on a pale background) */
.nudge{color:#3d2400}.nudge b,.nudge a{color:inherit}
:root:not([data-theme=day]) .nudge{background:#3a2600;border-color:#ffb020;color:#ffe6b3}
#duplist li{margin:6px 0}#duplist .btn{margin-left:6px}
#mergetwo select{width:100%;max-width:100%}
/* 3.7.0 field rules + redirected edits */
#fieldrules .rules { padding-left: 1.2em; margin: .4em 0; }
#fieldrules .rules li { margin: .5em 0; }
table.conf tr.redir td:first-child { font-style: italic; }
#codepick input { text-transform: uppercase; }
/* v3.7.1: chip/pill groups (Navigates to, Equipment types, Opto groups, checklist multiselects, Areas served, record filters) wrap onto new lines.
   Before: .chips was a no-wrap flex row and .chip was nowrap, while the 3.5.0 rule label{min-width:0} let each pill shrink below its text, so labels spilled over their neighbours. */
.chips{flex-wrap:wrap;overflow-x:visible;align-items:stretch}
.chip{white-space:normal;overflow-wrap:anywhere;word-break:normal;flex:0 1 auto;min-width:0;max-width:100%;height:auto;line-height:1.25;gap:8px}
.chip>span{min-width:0;overflow-wrap:anywhere}
.chip>input{flex:0 0 28px;width:28px;height:28px;min-height:0;margin:0;padding:0}
.chip>span{margin:0}

</style>

<script>/* js/schema-map.js */
/* schema-map.js - the ONE place that binds the app to the Site Visit Analyst's canonical schema.
   Raw enums / checklist / export headers come from js/analyst-schema.js (generated from ../system by
   tools/gen_analyst.py; never hand-edited). This file holds every RULE that uses them, as data where possible:
   site defaults, hierarchy, path + filename templates, ID formats, statuses + verify gates, required-field
   profiles, the two status encodings, tag-group rules, CSV dialect, redaction and seed-import hooks.
   Gate logic itself is js/gates.js (1:1 port of the Analyst's tools/gates.py). */
const AS = ANALYST, EN = AS.enums;
const ANALYST_SCHEMA = { version: AS.version, $id: AS.id, checklistVersion: AS.checklist.checklistVersion, sourceHash: AS.sourceHash };

/* ---------- site / tag model (SUP §1.4, §1.6, §3) ---------- */
const SITE_DEFAULTS = { ...AS.site, siteName: 'WinCo Foods Ellensburg DC', customer: 'WinCo Foods', timezone: 'America/Los_Angeles', architectureModel: 'TBD' };
const siteOf = B => ({ ...SITE_DEFAULTS, ...(B.visit.site || {}) });

/* ---------- hierarchy (checklist.json "hierarchy") ----------
   2.1.0: Area -> SubSystem -> ControlPanel -> Section. The Sub-System code IS the ISA-95 LineOrCell segment
   (SUP §1.1), so tag paths ({lineOrCell}) follow it; seeded Sub-Systems come from checklist.json subSystems. */
const HIERARCHY = [...AS.checklist.hierarchy];                       // ['Area','SubSystem','ControlPanel','Section']
const SUBSYSTEM_CODE_RE = new RegExp(AS.model.SUBSYSTEM_CODE_PATTERN || '^[A-Za-z0-9_-]{2,32}$');
const SUBSYSTEM_KIND = AS.defs.SubSystem.properties.kind.enum, SUBSYSTEM_SEED = AS.defs.SubSystem.properties.seedSource.enum;
const subSystemId = (area, code) => `SUB-${area}-${code}`;
/* all Sub-Systems for a visit: seeded (checklist.json) + added on site (visit.subSystems) */
const subSystemsOf = B => [...AS.checklist.subSystems, ...((B && B.visit && B.visit.subSystems) || [])];
const subSystemById = (B, id) => subSystemsOf(B).find(x => x.id === id);
const subSystemsForArea = (B, area) => subSystemsOf(B).filter(x => x.area === area);
const seedPanel = label => AS.checklist.panels.find(p => p.panelLabel === label);
const HIERARCHY_LABEL = { Area: 'Area', ControlPanel: 'Control panel', Section: 'Section', SubSystem: 'Sub-system' };

/* ---------- path templates (exports.md OptoWesPath / ISA95Path / LegacyCPPath; tools/build_exports.py) ---------- */
const PATH_TEMPLATES = {
  optoWes: '[{optoProvider}]{runtimeRoot}/{area}/{lineOrCell}/{equipmentType}/{instanceId}/{folder}/{point}',
  isa95: '[{tagProvider}]{enterprise}/{siteCode}/{area}/{lineOrCell}/{equipmentType}/{instanceId}/{folder}/{point}',
  legacyCp: '{panelIdNormalized}/{areaBlock}/{subArea}/{point}'      // DES §6.3; only for 5-digit conveyor numbers
};
const fillTpl = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const tidyPath = p => p.replace(/(?<!\])\/{2,}/g, '/').replace(/\/$/, '');
function tagPaths(site, x) {   // x = {area, lineOrCell, equipmentType, instanceId, folder, point, panelIdNormalized, conveyorNumber}
  const v = { ...site, ...x };
  const cn = String(x.conveyorNumber || '');
  const legacy = x.panelIdNormalized && /^\d{5}$/.test(cn) ? fillTpl(PATH_TEMPLATES.legacyCp, { ...v, areaBlock: +cn[0] * 10000, subArea: cn.slice(1) }) : '';
  return { optoWesPath: tidyPath(fillTpl(PATH_TEMPLATES.optoWes, v)), isa95Path: tidyPath(fillTpl(PATH_TEMPLATES.isa95, v)), legacyCpPath: legacy };
}

/* ---------- business IDs (schema: prefixed, stable, never reused) ---------- */
const ID_PREFIX = { visit: 'VIS', area: 'AREA', panel: 'PNL', section: 'EQ', tag: 'TAG', alarm: 'ALM', screen: 'SCR', issue: 'ISS', media: 'MED', observation: 'OBS', interview: 'INT', checklist: 'CLR', day: 'DAY' };
const ID_WIDTH = 4;                                                  // ISS-0001, ALM-0001, MED-0001 (sample-data.json)
const idSafe = s => String(s ?? '').replace(/[^A-Za-z0-9._()-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
/* 3.6.0 (Reviewer M2): human-readable IDs carry the author's device code - ISS-JR-0003, OBS-KL-0012, MED-JR-0007 - so two phones never
   mint the same ID. Schema patterns ^ISS-[A-Za-z0-9._()-]+$ etc. allow it. Legacy unprefixed IDs (ISS-0003) stay valid. */
const seqId = (kind, n, code) => `${ID_PREFIX[kind]}-${code ? code + '-' : ''}${String(n).padStart(ID_WIDTH, '0')}`;
/* 3.7.0 S2: optional single-digit suffix when two people share initials (JR, JR2) - still matches ^ISS-[A-Za-z0-9._()-]+$ */
const validDevCode = c => /^[A-Z]{2,4}[0-9]?$/.test(String(c || ''));
const bidCode = b => { const m = /^[A-Z]+-([A-Z]{2,4}[0-9]?)-\d+(?:-[0-9a-f]{6})?$/.exec(b || ''); return m ? m[1] : ''; };

/* ---------- instance IDs (schema Equipment.instanceId; SUP §1.4; tag-naming.md D4) ---------- */
const INSTANCE_ID = { re: new RegExp(AS.patterns.instanceId), conveyorRe: new RegExp(AS.patterns.conveyorNumber), minDigits: 3,
  hint: '{Abbr}-{NNN}[-NN], 3-6 digits + optional letter + optional 2-digit suffix (MDR-20101, PE-20101-02, DIV-004A)' };
const abbrOf = type => AS.equipmentTypes[type]?.abbr || 'OTH';
const udtOf = type => AS.equipmentTypes[type]?.udt || '';
/* nth=1 -> bare (PE-20101); nth>=2 -> PE-20101-02 (tools/naming.py instance_id; Equipment.instanceSuffix 2-99) */
const sectionInstanceId = (type, conv, nth = 1) => conv ? (+nth >= 2 ? `${abbrOf(type)}-${conv}-${String(+nth).padStart(2, '0')}` : `${abbrOf(type)}-${conv}`) : '';
const validInstanceId = id => INSTANCE_ID.re.test(String(id || ''));
/* next ID keeps >= 3 digits: SCN-09 -> SCN-010, MDR-20101 -> MDR-20102, DIV-004A -> DIV-005A, 20199 -> 20200 */
function nextInstanceId(id, step = 1) {

/* Video poster thumbnail (videos are never decoded into JS memory - the File/Blob is stored as-is). */
async function makeThumb(blob, kind) {

  const url = URL.createObjectURL(blob); let v, c;

    v = await new Promise((res, rej) => { const to = setTimeout(() => rej(new Error('timeout')), 6000); const e = document.createElement('video'); e.muted = true; e.playsInline = true; e.preload = 'auto';

    c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return await canvasThumb(c);
  } catch (e) { return null; } finally { releaseCanvas(c); if (v) { v.removeAttribute('src'); v.load?.(); } URL.revokeObjectURL(url); }
}
/* ================= 3.7.3: low-memory photo capture =================
   iOS killed the page ("low memory") because 3.7.1 decoded every camera photo at FULL resolution (12-48 MP = 48-190 MB of pixels)
   before shrinking it. Now: the photo is decoded already downscaled (createImageBitmap resize, feature-detected; else one <img>
   drawn straight onto ONE target-size canvas), encoded with toBlob (never toDataURL), the thumbnail is cut from that small canvas,
   only the first 128 KB are read for EXIF, everything is released at once, and captures run strictly one at a time.
   If decode / encode fails: automatic retry at 1000 px q0.6, then 800 px q0.5; then a "Photo NOT saved" card with Retry and
   "Save original without compression". Stored media / IDs are never touched. */

const releaseCanvas = c => { if (c) { c.width = 0; c.height = 0; } };

async function canvasThumb(src) {   /* small (<=360 px) JPEG data URL from an already-small canvas - format kept for existing media / backups */
  let t;
  try { const sc = Math.min(1, THUMB_MAX / Math.max(src.width, src.height)); t = document.createElement('canvas'); t.width = Math.max(1, Math.round(src.width * sc)); t.height = Math.max(1, Math.round(src.height * sc));
    t.getContext('2d').drawImage(src, 0, 0, t.width, t.height); const b = await new Promise(res => t.toBlob(res, 'image/jpeg', 0.72)); return b ? await blobToDataURL(b) : null;

      case 'accessissue': { const r = recById(b.dataset.id); await offerAccessIssue(r, true); break; }
      case 'ist': { const r = s.resp[b.dataset.item] = s.resp[b.dataset.item] || { state: 'todo', a: {}, q: {}, note: '' }; if (r.state === b.dataset.v) break;
        r.state = b.dataset.v; r.at = Date.now(); r.by = author(); r.dayId = activeDay()?.id; touch('stops', s); route(); break; }
      case 'shotna': { const sh = s.shots.find(x => x.id === b.dataset.shot);
        if (b.dataset.v === '1') { if (sh.req && !REQUIRED_PHOTO_NA_ALLOWED.includes(sh.photoType)) { toast('Required photo - N/A is not allowed'); break; } const why = prompt('Why is this photo N/A?', sh.naReason || ''); if (why === null) break; sh.na = true; sh.naReason = why.trim(); }
        else { sh.na = false; sh.naReason = ''; }
        touch('stops', s); route(); break; }
      case 'stopverify': { const probs = stopGate(S, s);
        if (probs.length) { ui.showMiss = s.id; modal(`<h3>Can't verify yet</h3><ul class="gate">${probs.map(p => `<li>${esc(p)}</li>`).join('')}</ul><button class="btn pri" data-act="mclose">OK</button>`); break; }
        const sg = stopGateStatus(S, s);   /* 3.0.0: + tools/gates.py walkdown/data gates on the exported record */
        if (sg.best === 'open') { ui.showMiss = s.id; modal(`<h3>Can't verify yet</h3><p class="small">Walk-down gate (gates.py) not met:</p><ul class="gate">${sg.missing.slice(0, 30).map(p => `<li>${esc(p)}</li>`).join('')}</ul><button class="btn pri" data-act="mclose">OK</button>`); break; }
        s.recordStatus = sg.best; s.gates = { ...(s.gates || {}), verified: { at: Date.now(), by: author(), status: sg.best } }; touch('stops', s); await flush();
        if (sg.best !== 'verified') toast(`Marked ${RECORD_STATUS[sg.best] || sg.best} - still missing for full Verified: ${sg.missing.slice(0, 3).join(', ')}`, 5000); route(); await afterComplete(s); break; }
      case 'stopna': { const why = prompt('Why is this stop N/A?', s.naReason || ''); if (why === null) break; s.recordStatus = 'na'; s.naReason = why.trim(); touch('stops', s); route(); break; }
      case 'stopreopen': s.recordStatus = 'open'; touch('stops', s); route(); break;
      case 'addpanel': { const label = $('#newpanel').value.trim().toUpperCase(); if (!label) { toast('Panel label first (e.g. MCP-24A)'); break; }
        if (panelStops().some(p => p.panel.label === label)) { toast('That panel already exists'); break; }
        const st = newPanelStop(S.visit.id, label, $('#newpaneltype').value, $$('.newpanelarea:checked').map(x => x.value), S.stops.length);
        S.stops.push(st); touch('stops', st); await flush(); location.hash = `#/v/${S.visit.id}/s/${st.id}`; break; }
      /* sections (checklist.json sectionTemplate.repeat generators) */
      case 'secnew': { const r = sectionFrom(s, {}); await flush(); goRec(r); break; }
      case 'secnext': { const prev = sectionsOf(s.id).at(-1), type = prev.f.equipmentType || 'Other';
        const conv = freeConveyor(type, nextConveyorNumber(prev.f.conveyorNumber || '') || '');
        const r = sectionFrom(s, { conveyorNumber: conv, equipmentType: type, driveType: prev.f.driveType || '', 'location.level': getD(prev.f, 'location.level') || '' });
        await flush(); toast('Next section ' + (secIid(r) || '')); goRec(r); break; }
      case 'secrange': { const g = await askForm(`<h3>Add a range of sections</h3><div class="row2"><label class="fld"><span>From conveyor #</span><input name="from" inputmode="numeric" placeholder="20101"></label><label class="fld"><span>To</span><input name="to" inputmode="numeric" placeholder="20150"></label></div>
          <div class="row2"><label class="fld"><span>Step</span><input name="step" inputmode="numeric" value="1"></label><label class="fld"><span>Equipment type</span><select name="type">${EN.equipmentType.map(t => opt(t, 'MDRZone')).join('')}</select></label></div>
          <label class="fld"><span>Drive type</span><select name="drive">${EN.driveType.map(t => opt(t, 'Unknown')).join('')}</select></label><div class="row"><button class="btn pri" data-choice="ok">Add</button><button class="btn" data-choice="cancel">Cancel</button></div>`);
        if (g?.choice !== 'ok') break;
        const step = Math.max(1, parseInt(g.step) || 1), from = String(g.from).trim(), to = parseInt(g.to);
        if (!/^\d{3,6}[A-Z]?$/.test(from) || !(to >= parseInt(from))) { toast('From/To must be 3-6 digit numbers, To ≥ From', 3500); break; }
        const used = usedIids(); let n = 0, skip = 0, c = from;
        for (let i = 0; parseInt(c) <= to && n < 500; i++, c = nextConveyorNumber(c, step)) { if (used.has(sectionInstanceId(g.type, c))) { skip++; continue; }
          sectionFrom(s, { conveyorNumber: c, equipmentType: g.type, driveType: g.drive }, { sequenceInRun: i + 1 }); n++; }
        await flush(); toast(`Added ${n} sections${skip ? ` (${skip} already existed)` : ''}`, 3000); route(); break; }
      case 'seedimp': { const kind = b.dataset.kind, imp = SEED_IMPORTERS[kind], f = await pickFile(imp.accept); if (!f) break;
        const rep = await seedImport(s, kind, await f.text(), f.name); ui.lastSeedReport = rep;
        await flush(); route(); modal(seedReportHtml(rep)); break; }
      case 'selsec': b.checked ? ui.sel.add(b.dataset.id) : ui.sel.delete(b.dataset.id); break;
      case 'selall': sectionsOf(s.id).forEach(r => ui.sel.add(r.id)); route(); break;
      case 'selnone': ui.sel.clear(); route(); break;
      /* bulk verify NEVER writes presentOnSite (3.0.0 attest): sections without a Yes/No tap stay open */
      case 'bulkverify': { const sel = sectionsOf(s.id).filter(r => ui.sel.has(r.id)); let ok = 0, noAtt = 0;
        for (const r of sel) { const g = sectionGate(S, r); if (g.best === 'open') { if (g.walkMissing.includes('presentOnSite')) noAtt++; continue; }
          if (STATUS_ORDER[g.best] <= STATUS_ORDER[r.recordStatus] && r.recordStatus !== 'na') continue;
          r.recordStatus = g.best; r.gates = { ...(r.gates || {}), verified: { at: Date.now(), by: author(), status: g.best } }; touch('records', r); ok++; }
        await flush(); toast(`Verified ${ok} of ${sel.length}${sel.length - ok ? ` · ${sel.length - ok} not changed` : ''}${noAtt ? ` (${noAtt} need a Yes/No present-on-site tap)` : ''}`, 4500); ui.sel.clear(); route(); break; }
      case 'secphotona': { const r = recById(b.dataset.id); r.photoNa = r.photoNa || {}; r.photoNa[b.dataset.type] = !r.photoNa[b.dataset.type]; touch('records', r); route(); break; }
      case 'recverify': { const r = recById(b.dataset.id);
        if (r.type === 'section') { const g = sectionGate(S, r);
          if (g.best === 'open') { ui.showMiss = r.id; toast('Walk-down gate not met: ' + g.walkMissing.join(', '), 5000); route(); break; }
          /* 3.1.0: "Trip 1 stops at walkdown_verified" is a UI rule only - a section whose data gate already passes on the intro trip
             (PackML fields from an L5X import) is allowed past Seen with a warning; the export carries gates.attestation_warnings' advisory */
          const past = secIntro(r, g) && ['data_verified', 'verified'].includes(g.best);
          r.recordStatus = g.best; r.gates = { ...(r.gates || {}), verified: { at: Date.now(), by: author(), status: g.best } }; touch('records', r); await flush();
          if (past) { toast(`⚠ ${RECORD_STATUS[g.best] || g.best} on the intro trip${r.seedSource === 'L5X' ? ' (PackML data from the L5X import)' : ''} - Trip 1 sections normally stop at Seen. Allowed; the export carries an advisory.`, 6000); route(); break; }
          toast(g.best === 'verified' ? 'Verified ✓' : secIntro(r, g) ? `${statusLabel(r, g.best, g)} - Trip 1 sections stop here` : `${RECORD_STATUS[g.best] || g.best} ✓ · for full Verified: ${g.dataMissing.slice(0, 4).join(', ')}`, 4500); route(); break; }
        const miss = recMissing(S, r);
        if (miss.length) { ui.showMiss = r.id; toast('Fill required fields first: ' + miss.join(', '), 4500); route(); break; }
        r.recordStatus = 'verified'; r.gates = { ...(r.gates || {}), verified: { at: Date.now(), by: author() } }; touch('records', r); await flush(); toast('Verified ✓'); route(); break; }
      case 'recna': { const r = recById(b.dataset.id); r.recordStatus = 'na'; touch('records', r); route(); break; }
      case 'recopen': { const r = recById(b.dataset.id); r.recordStatus = 'open'; touch('records', r); route(); break; }
      case 'recclone': { const r = recById(b.dataset.id), c = newRecord(r.type, r.stopId);
        const f = JSON.parse(JSON.stringify(r.f)); delete f.serial; c.clonedFromUuid = r.id;
        if (r.type === 'section') for (const fd of SECTION_FIELDS) if (fd.attest) setD(f, fd.key, 'unknown');   /* 3.0.0: clone resets attest fields; c.attest stays empty, status open */
        if (r.type === 'section') { const stop = S.stops.find(x => x.id === r.stopId), type = f.equipmentType || 'Other';
          f.packml = packmlDefault(stop);
          if (f.instanceIdOverride) { const used = usedIids(); let id = nextInstanceId(f.instanceIdOverride); for (let i = 0; used.has(id) && i < 10000; i++) id = nextInstanceId(id); f.instanceIdOverride = id; f.conveyorNumber = ''; }
          else f.conveyorNumber = freeConveyor(type, nextConveyorNumber(f.conveyorNumber || ''));
          c.captureMode = r.captureMode; }
        else { const k = { screen: 'screenCode', tag: 'point', alarm: 'alarmCode' }[r.type]; if (k && f[k]) f[k] = nextName(f[k]); }
        c.f = f; touch('records', c); await flush(); toast('Cloned → ' + (recTitle(c) || 'copy')); goRec(c); break; }
      case 'recdel': { const r = recById(b.dataset.id), ms = S.media.filter(m => m.recordId === r.id);
        await softDelete([['records', r], ...ms.map(m => ['media', m])], `${recTitle(r) || 'record'}${ms.length ? ` + ${ms.length} media` : ''}`);
        location.hash = r.stopId ? `#/v/${S.visit.id}/s/${r.stopId}` : `#/v/${S.visit.id}/records`; break; }
      case 'newrec': { const r = newRecord(b.dataset.type, b.dataset.stop || ''); await flush(); goRec(r); break; }
      case 'navtog': { const r = recById(b.dataset.from), to = b.dataset.to, L = r.f.navigatesTo = r.f.navigatesTo || [];
        if (b.checked) { if (!L.includes(to)) L.push(to); } else r.f.navigatesTo = L.filter(x => x !== to); touch('records', r); break; }
      case 'more': ui[b.dataset.k] += 50; route(); break;
      case 'newday': { const d = newDay(S.visit.id, today(), S.days.length + 1); S.days.push(d); touch('days', d); S.visit.activeDayId = d.id; touch('visits', S.visit); await flush(); toast(d.label + ' started'); route(); break; }
      case 'ex': await doExport(b.dataset.x); break;
      case 'warnings': { const { warnings } = csvFiles(S, {}); modal(`<h3>Export warnings (${warnings.length})</h3><ul class="gate">${warnings.slice(0, 200).map(w => `<li>${esc(w)}</li>`).join('') || '<li>None</li>'}</ul><button class="btn pri" data-act="mclose">OK</button>`); break; }
      case 'import': $('#impFile').value = ''; $('#impFile').click(); break;
      case 'delvisit': { const n = S.visit.name || 'visit', t = prompt(`Delete "${n}" and all its media from this device?\nBack up first. Type the visit name to confirm:`); if (t === null) break;
        if (t.trim() !== n.trim()) { toast('Name did not match - nothing deleted', 3000); break; } pending.clear(); await dbDeleteVisit(S.visit.id); S = null; setStatus(); location.hash = '#/'; break; }
      case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } break;
      case 'persist': toast(navigator.storage?.persist ? ((await requestPersist()) ? 'Storage will persist ✓' : 'Browser declined persistence (install to Home Screen and retry)') : 'Not supported', 3500); fillStorage(); break;
      case 'backup': await backup(b.dataset.x); break;
      case 'bkshare': await bkShare(); break;
      case 'pkshare': await pkShare(); break;
      case 'pkdl': if (pk) download(pk.name, pk); break;
      case 'pkclose': pk = null; closeModal(); break;
      case 'bkdl': bkDownload(); break;
      case 'bkyes': await markBackup('download-confirmed'); break;
      case 'bkno': toast('Backup NOT marked done - try Share, or download again', 3500); break;
      case 'bkcancel': bk = null; closeModal(); toast('Backup cancelled - not marked done'); break;
      case 'mic': dictate(b); break;
    }
  } catch (err) { console.error(err); toast('Error: ' + err.message, 5000); }
}
document.addEventListener('click', onClick);

let searchT = null;
function onField(e) {
  const el = e.target;
  if (!tabLock.ok && !window.SV_TEST_NOLOCK) return;
  if (el.id === 'stopq' || el.id === 'recq') { ui[el.id === 'stopq' ? 'stopQ' : 'recQ'] = el.value; if (el.id === 'recq') ui.recLimit = 50;
    clearTimeout(searchT); searchT = setTimeout(async () => { const pos = el.selectionStart; await route(); const n = $('#' + el.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } }, 250); return; }
  if (el.id === 'recpanel') { ui.recPanel = el.value; ui.recLimit = 50; route(); return; }
  if (el.classList.contains('secq')) { const q = el.value.trim().toLowerCase(); $$('.secrow').forEach(r => r.hidden = !!q && !r.textContent.toLowerCase().includes(q)); return; }
  if (el.id === 'jump') { if (e.type !== 'change' && e.inputType) return; const v = el.value.trim().toUpperCase(), n = normalizePanelId(v);
    const p = panelStops().find(s => s.panel.label.toUpperCase() === v || (n && s.panel.idNorm === n)); if (p) location.hash = `#/v/${S.visit.id}/s/${p.id}`; return; }
  if (el.id === 'exday') return;
  if (el.dataset.change === 'day') { S.visit.activeDayId = el.value; touch('visits', S.visit); route(); return; }
  if (el.dataset.change === 'captype') return;
  if (el.dataset.pref) { localStorage.setItem(el.dataset.pref, el.value.trim()); return; }
  if (!el.dataset.obj || el.dataset.act) return;
  const [store, id] = el.dataset.obj.split(':');
  const obj = store === 'visits' ? S.visit : S[store].find(x => x.id === id); if (!obj) return;
  let v = el.type === 'checkbox' && !el.dataset.multi ? el.checked : el.value;
  if (el.dataset.multi !== undefined) { const cur = getP(obj, el.dataset.f), arr = Array.isArray(cur) ? [...cur] : splitList(cur || ''); const x = el.dataset.multi;
    v = el.checked ? (arr.includes(x) ? arr : [...arr, x]) : arr.filter(y => y !== x); }
  else if (el.dataset.t === 'int') v = el.value.trim() === '' ? '' : parseInt(el.value, 10);
  else if (el.dataset.t === 'num') v = el.value.trim() === '' ? '' : parseFloat(el.value);
  else if (el.dataset.t === 'bool') v = el.value === '' ? '' : el.value === 'true';
  else if (el.dataset.t === 'list') v = splitList(el.value.replace(/,/g, ';'));
  else if (el.dataset.t === 'bitmap') v = el.value.split('\n').map(parseBitMapLine).filter(Boolean);
  else if (el.dataset.t === 'interlocks') v = el.value.split('\n').map(parseInterlockLine).filter(Boolean);
  else if (el.dataset.t === 'qa') v = el.value.split('\n').filter(l => l.trim()).map(l => { const [q, ...r] = l.split('::'); return { q: q.trim(), a: r.join('::').trim() }; });
  if (typeof v === 'number' && isNaN(v)) v = el.value;
  setP(obj, el.dataset.f, v); touch(store, obj);
  if (store === 'records' && obj.type === 'section' && /conveyorNumber|instanceIdOverride|equipmentType/.test(el.dataset.f)) { const h = $('#iidhint'); if (h) { const iid = secIid(obj); h.textContent = iid ? (validInstanceId(iid) ? '✓ ' + iid : '⚠ ' + iid + ' - ' + INSTANCE_ID.hint) : ''; } }
  if (e.type === 'change' && (el.tagName === 'SELECT' || el.type === 'checkbox') && !$('.modal')) route();
}
document.addEventListener('input', e => { if (e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox') onField(e); });
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.id === 'jump') onField(e); });
document.addEventListener('toggle', e => { const k = e.target.dataset?.key; if (!k) return; ui.open[k] = e.target.open; localStorage.setItem('sv-open', JSON.stringify(ui.open));
  const ph = e.target.querySelector(':scope > .secbody > [data-lazy]'); if (e.target.open && ph && lazy[k]) ph.outerHTML = lazy[k](); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.modal') && !bk) closeModal(); });
for (const id of ['capPhoto', 'capVideo', 'capLib']) { const el = document.getElementById(id);
  el.addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return capMark(null);   /* input lets go of the File list */
    try { const mk = JSON.parse(localStorage.getItem('sv-cap-pending') || 'null'); if (mk) capMark({ ...mk, phase: 'processing', at: Date.now() }); } catch (_) { }
    addFiles(fs).catch(err => { capMark(null); toast('Capture failed: ' + err.message, 6000); }); });
  el.addEventListener('cancel', () => capMark(null)); }
$('#impFile').addEventListener('change', e => e.target.files[0] && importFile(e.target.files[0]).catch(err => { console.error(err); modal(`<h3>Import failed</h3><p>${esc(err.message)}</p><p>Nothing on this device was changed.</p><button class="btn pri" data-act="mclose">OK</button>`); }));
addEventListener('online', () => route()); addEventListener('offline', () => route());
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!S) route(); });

/* ================= 3.7.0: Field rules card (help, and once on first run) ================= */
const FIELD_RULES = [
  ['📱', 'One device code per phone', 'Set it at setup (JR, KL - same initials: JR2). Never share a code between phones; after a reinstall pick a new one.'],
  ['🔀', 'Restore with Merge, never Replace', 'Merge keeps both sides and lists every difference. Replace is only for a damaged device copy.'],
  ['🏠', 'Install to the Home Screen before going on site', 'iPhone: Share → Add to Home Screen, then open the icon. A browser tab can lose its data.'],
  ['💾', 'Back up after each panel', 'Export → Backup (incremental is quick) and send it to your teammate / laptop.']];
const fieldRulesHtml = () => `<div id="fieldrules"><h3>Field rules</h3><ol class="rules">${FIELD_RULES.map(([i, t, d]) => `<li><b>${i} ${esc(t)}</b><br><span class="small">${esc(d)}</span></li>`).join('')}</ol>
  <p class="small muted">Always here: home page → Field rules, or Visit setup → Field rules.</p><button class="btn big pri" data-act="rulesok">Got it</button></div>`;
function showFieldRules() { if ($('#fieldrules')) return; closeModal(false); modal(fieldRulesHtml(), 'rulesbox'); }
function firstRunRules() { if (localStorage.getItem('sv-rules-seen') || $('#iosblock') || $('#tablock')) return; showFieldRules(); }

/* ================= router ================= */
const app = $('#app');
let routing = false, routeAgain = false;
async function route() {
  if (routing) { routeAgain = true; return; }
  routing = true; routeAgain = false;
  try {
    const y = scrollY, prev = location.hash;
    const [path, qs] = location.hash.replace(/^#\/?/, '').split('?'); const p = path.split('/'), q = new URLSearchParams(qs || '');
    if (p[0] !== 'v') { await renderHome(); $('#codepick')?.remove(); }
    else {
      if (!(await loadVisit(p[1]))) { location.hash = '#/'; return; }
      if (route.lastVisit !== p[1]) { ui.sel.clear(); ui.recQ = ''; ui.stopQ = ''; ui.recPanel = ''; route.lastVisit = p[1]; }
      ({ s: () => renderStop(p[3]), r: () => renderRecord(p[3]), records: () => renderRecords(q), nav: renderNav, media: renderMedia, export: renderExport, settings: renderSettings }[p[2]] || renderVisit)();
      codePickBlocker();   /* 3.7.0 S2: blocks capture until this phone has a code of its own */
    }
    if (route.last === prev) scrollTo(0, y); else { scrollTo(0, 0); ui.recLimit = 50; ui.mediaLimit = 60; } route.last = prev; fillStorage();
  } finally { routing = false; if (routeAgain) { routeAgain = false; route(); } }
}
addEventListener('hashchange', route);

/* ================= init ================= */
document.documentElement.dataset.theme = localStorage.getItem('sv-theme') || 'dark';
if (localStorage.getItem('sv-big')) document.documentElement.classList.add('big');
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.SV_SINGLE)
  navigator.serviceWorker.register('sw.js').then(() => { const el = $('#swstat'); if (el) el.textContent = swStatus(); }).catch(e => console.warn('SW failed', e));
navigator.serviceWorker?.addEventListener?.('controllerchange', () => { const el = $('#swstat'); if (el) el.textContent = swStatus(); if (route.hadController) toast('App updated ✓ - close and reopen the app to use the new version', 6000); });
route.hadController = !!navigator.serviceWorker?.controller;
iosGate(); acquireLock(); refreshQuota(); route().then(() => setTimeout(() => { capInterrupted(); firstRunRules(); }, 50));

</script>
